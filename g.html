<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR GAME | VIP ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent-cyan: #00f0ff; 
            --accent-orange: #ff7a00;
            --bg-gradient: #0b0e14; 
        }
        
        body { 
            background: var(--bg-gradient); 
            color: white; 
            font-family: 'Outfit', sans-serif; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px);
        }

        .container { width: 100%; max-width: 420px; }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .balance-badge {
            background: linear-gradient(135deg, #151b26, #0e121a);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 6px 14px 6px 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .coin-icon {
            width: 26px;
            height: 26px;
            background: radial-gradient(circle, #ffd700 60%, #ff8800 100%);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 8px;
            letter-spacing: 1px;
            color: #8b9bb4;
            font-weight: 600;
        }

        .balance-amount {
            font-size: 13px;
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
        }

        .header-icons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            background: #151b26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .icon-btn img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .notification-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ff3b30;
            color: white;
            font-size: 9px;
            font-weight: 900;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #0b0e14;
        }

        .hero-card {
            background: linear-gradient(180deg, #161c28 0%, #10141e 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .hero-title {
            color: var(--accent-cyan);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .hero-desc {
            color: #b0c2de;
            font-size: 11px;
            line-height: 1.4;
            margin: 0 0 15px 0;
            padding: 0 10px;
        }

        .hero-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            border-radius: 8px;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(255,122,0,0.1);
        }

        .warning-stripe {
            height: 8px;
            width: calc(100% + 30px);
            margin: 15px -15px -20px -15px;
            background: repeating-linear-gradient(45deg, #151b26, #151b26 10px, var(--accent-orange) 10px, var(--accent-orange) 20px);
            opacity: 0.8;
        }

        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .tab-item {
            flex: 1;
            background: #151b26;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 8px;
            text-align: center;
            font-size: 9px;
            font-weight: 900;
            color: #556680;
            letter-spacing: 0.5px;
            position: relative;
        }

        .tab-item.active {
            color: #fff;
            border-color: rgba(0, 240, 255, 0.4);
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: #8b9bb4;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            padding: 0 2px;
        }

        .status-bar span:last-child {
            color: var(--accent-cyan);
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        
        .channel-card {
            background: linear-gradient(145deg, #161c28, #0e121a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .channel-card .card-index {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 9px;
            color: #556680;
            font-weight: 900;
        }

        .card-icon-box {
            width: 48px;
            height: 48px;
            margin: 5px auto 10px auto;
            background: #0b0e14;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1), 0 0 10px rgba(0, 240, 255, 0.15);
        }

        .card-icon-box svg, .card-icon-box img {
            width: 22px;
            height: 22px;
            fill: var(--accent-cyan);
        }

        .join-btn {
            display: block; 
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            background: transparent; 
            color: var(--accent-cyan); 
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            font-weight: 900; 
            font-size: 9px; 
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        
        .join-btn:hover { background: var(--accent-cyan); color: #000; }

        .pending-state {
            border-color: var(--accent-orange) !important;
        }
        .pending-state .card-icon-box {
            border-color: var(--accent-orange);
            box-shadow: inset 0 0 10px rgba(255,122,0,0.1), 0 0 10px rgba(255,122,0,0.2);
        }
        .pending-text {
            color: var(--accent-orange) !important;
            border-color: var(--accent-orange) !important;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,122,0,0.2);
            border-top: 2px solid var(--accent-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .cont-btn { 
            width: 100%; 
            padding: 14px; 
            background: #151b26; 
            border: 1px solid rgba(255,255,255,0.08); 
            color: #4a5a75; 
            border-radius: 8px; 
            font-weight: 900; 
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .cont-btn.active { 
            background: linear-gradient(135deg, #1b2436, #111722);
            border-color: var(--accent-cyan); 
            color: white; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); 
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 8px;
            color: #4a5a75;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        #referral-section { display: none; padding: 20px; background: #121722; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .link-box { background: #0b0e14; padding: 12px; border-radius: 8px; margin: 15px 0; border: 1px solid var(--accent-cyan); font-size: 11px; color: var(--accent-cyan); word-break: break-all; }
        .copy-btn { width: 100%; padding: 12px; background: var(--accent-cyan); color: #0b0e14; border: none; border-radius: 8px; font-weight: 900; font-size: 11px; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <div class="balance-badge">
            <div class="coin-icon"></div>
            <div class="balance-info">
                <span class="balance-label">BALANCE</span>
                <span class="balance-amount">₹ 100.00</span>
            </div>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <img src="https://img.icons8.com/ios-filled/50/ffd700/bell.png" alt="Notifications">
                <div class="notification-dot">3</div>
            </div>
            <div class="icon-btn">
                <img src="https://img.icons8.com/ios-filled/50/ff99bb/headset.png" alt="Support">
            </div>
        </div>
    </div>

    <div class="hero-card">
        <h1 class="hero-title">HUMAN VERIFICATION</h1>
        <p class="hero-desc">Get a Random Bonus Upon Register bonus You play games !!</p>
        <button class="hero-btn">VERIFY YOUR HUMAN ACTIVITY TO UNLOCK</button>
        <div class="warning-stripe"></div>
    </div>

    <div id="task-section">
        <div class="tabs-container" id="tabs-container">
            <div class="tab-item active" id="tab-0">STEP 1</div>
            <div class="tab-item" id="tab-1">STEP 2</div>
        </div>

        <div class="status-bar">
            <span>VERIFICATION <span id="current-step">1</span> / <span id="total-steps">2</span></span>
            <span>REMAINING <span id="remaining-count">4</span></span>
        </div>

        <div class="grid-container" id="channel-list"></div>

        <button class="cont-btn" id="verify-btn" disabled>UNLOCK</button>
    </div>

    <div id="referral-section">
        <h2 style="margin-top:0; font-size: 16px; color: var(--accent-cyan);">Almost There!</h2>
        <p style="color:#8b9bb4; font-size: 11px;">Invite friends to unlock the secure reward system.</p>
        <div class="link-box" id="link-text">https://casinolootprmo.github.io/krgame/</div>
        <button class="copy-btn" onclick="copyLink()">COPY INVITE LINK 📋</button>
    </div>

    <div class="footer-note" style="margin-top: 15px;">
        Secure Human Activity Check • BET101Z
    </div>
</div>

<script>
    const allChannels = [
        "https://t.me/+LeFW9DAuioFiZGI1",
        "https://t.me/+0rEdoi3ylpc3ZWQ1",
        "https://t.me/AlltypeEarning4",
        "https://t.me/+xgtZDjPmUw0xYjdl",
        "https://t.me/+4Q96rgsV_6E5ZDg9",  
        "https://t.me/+mA9Q5QutzOk0MGY1", 
        "https://t.me/+GNDpfwLpIis1NDVl",
        "https://t.me/+z2mE_RY77D80Yjc1", 
        "https://t.me/+foVJpIXVdM9lNTFl", 
        "https://t.me/+sDb28Vr76RpiNjI9",
        "https://t.me/+7pbUoSjjBnA2Zjk9", 
        "https://t.me/+hyNyd-abKRRjYzFl", 
        "https://t.me/+dAxCS-t3bEI5Yzk9", 
        "https://t.me/+KqiuU7Xngu03N2Q9"
    ];

    const pageSize = 4;
    let currentPage = 0;
    const totalPages = Math.ceil(allChannels.length / pageSize);
    
    const completedChannels = new Set();
    let pendingGlobalIndex = null;

    function getCurrentPageChannels() {
        const start = currentPage * pageSize;
        return allChannels.slice(start, start + pageSize);
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('tabs-container');
        tabsContainer.innerHTML = '';
        for (let p = 0; p < totalPages; p++) {
            tabsContainer.innerHTML += `<div class="tab-item ${p === currentPage ? 'active' : ''}" id="tab-${p}">STEP ${p + 1}</div>`;
        }
        document.getElementById('total-steps').innerText = totalPages;
        document.getElementById('current-step').innerText = currentPage + 1;
    }

    function renderCards() {
        renderTabs();
        const list = document.getElementById('channel-list');
        list.innerHTML = '';
        
        const pageChannels = getCurrentPageChannels();
        let remainingOnPage = 0;

        pageChannels.forEach((link, idx) => {
            const globalIdx = (currentPage * pageSize) + idx;
            const isJoined = completedChannels.has(globalIdx);
            const isPending = (globalIdx === pendingGlobalIndex);

            if (!isJoined) {
                remainingOnPage++;
                let cardClass = "channel-card";
                if (isPending) cardClass += " pending-state";

                let iconContent = `<svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>`;
                let btnText = "CLICK AND VERIFY";
                let btnClass = "join-btn";

                if (isPending) {
                    iconContent = `<div class="spinner"></div>`;
                    btnText = "PENDING...";
                    btnClass += " pending-text";
                }

                list.innerHTML += `
                    <div class="${cardClass}" id="c-${globalIdx}">
                        <div class="card-index">#${globalIdx + 1}</div>
                        <div class="card-icon-box">
                            ${iconContent}
                        </div>
                        <a href="${link}" target="_blank" class="${btnClass}" onclick="mark(event, ${globalIdx})">${btnText}</a>
                    </div>`;
            }
        });

        document.getElementById('remaining-count').innerText = allChannels.length - completedChannels.size;

        if (remainingOnPage === 0 && pendingGlobalIndex === null) {
            if (currentPage + 1 < totalPages) {
                currentPage++;
                renderCards();
            } else if (completedChannels.size === allChannels.length) {
                const b = document.getElementById('verify-btn');
                b.classList.add('active'); 
                b.disabled = false;
            }
        }
    }

    function mark(e, globalIdx) {
        e.preventDefault();
        window.open(allChannels[globalIdx], '_blank');

        if (!completedChannels.has(globalIdx) && pendingGlobalIndex === null) {
            pendingGlobalIndex = globalIdx;
            renderCards();

            setTimeout(() => {
                completedChannels.add(globalIdx);
                pendingGlobalIndex = null;
                renderCards();
            }, 3000);
        }
    }

    document.getElementById('verify-btn').onclick = () => {
        if(completedChannels.size === allChannels.length) {
            document.getElementById('task-section').style.display = 'none';
            document.getElementById('referral-section').style.display = 'block';
        }
    }

    function copyLink() {
        navigator.clipboard.writeText("https://casinolootprmo.github.io/casinosite1/");
        alert("Link Copied! Share with friends.");
    }

    renderCards();
</script>
</body>
</html>
